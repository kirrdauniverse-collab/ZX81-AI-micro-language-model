name: PIOCO ZX81 16K ROM INPUT build

on:
  push:
    branches:
      - work/pio-co-16k-z88dk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zx81-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
      - name: Build ROM INPUT profile and optimized ZX81 program
        working-directory: GLM/reference/glm-v0.5.4
        run: |
          set -euxo pipefail
          mkdir -p build/zx81/models_en models16_v05_en ports/zx81/pio16_release
          cat > build/zx81/english8_qat_g2.bin.b64 <<'MODEL'
          
          MODEL
          base64 -d build/zx81/english8_qat_g2.bin.b64 > models16_v05_en/english8_qat_g2.bin
          python3 tools/prepare_pio16_rom_input.py
          python3 tools/test_zx81_fp_profile.py
          DEFS="-DZX81_RAMTOP_LAYOUT -DRT_MAX_VOCAB=48 -DRT_MAX_CTX=8 -DRT_MAX_EMB=4 -DRT_MAX_HID=8 -DRT_APP_MODEL_MAX=1100 -DRT_MEM_MAX=6 -DRT_JOURNAL_MAX=8 -DRT_LINE_MAX=64"
          docker pull z88dk/z88dk:latest
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src/GLM/reference/glm-v0.5.4 z88dk/z88dk:latest zcc +zx81 -vn -O3 -m -zorg=16514 -create-app $DEFS -Iengine -Iports/zx81 -o build/zx81/rtchat16 ports/zx81/hal_zx81.c ports/zx81/app16.c ports/zx81/intent16.c engine/rt_charset.c engine/rt_model.c engine/rt_engine.c engine/rt_chat.c
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src/GLM/reference/glm-v0.5.4 z88dk/z88dk:latest zcc +zx81 -vn -O3 -m -zorg=16514 -create-app $DEFS -Iengine -Iports/zx81 -o build/zx81/rboot16 ports/zx81/hal_zx81.c ports/zx81/boot16.c
          python3 tools/extract_zx81_rem.py build/zx81/rtchat16.P build/zx81/rtchat16.bin
          python3 tools/extract_zx81_rem.py build/zx81/rboot16.P build/zx81/rboot16.bin
          for name in base_g topic_science topic_lifestyle topic_hobby topic_health topic_work topic_art topic_learning topic_literature topic_movies topic_programming topic_astronomy topic_asciiart topic_verse; do cp models16_v05_en/english8_qat_g2.bin "build/zx81/models_en/$name.bin"; done
          RT16_LAYOUT=ramtop RT16_SYSVARS_TEMPLATE=build/zx81/rtchat16.P python3 tools/t81build16.py build/zx81/rtchat16.bin build/zx81/rboot16.bin build/zx81/models_en ports/zx81/pio16_release
          cp ports/zx81/pio16_release/GLM_v054_RT16_TOPICS.t81 ports/zx81/pio16_release/PIOCO_AI_English_16K_ROM_INPUT.t81
          RT16_LAYOUT=ramtop python3 tools/verify_ramtop_tape.py ports/zx81/pio16_release/PIOCO_AI_English_16K_ROM_INPUT.t81
          python3 - <<'PY'
          from pathlib import Path
          data = Path('ports/zx81/pio16_release/PIOCO_AI_English_16K_ROM_INPUT.t81').read_bytes()
          assert data.startswith(b'EO81')
          print('ROM INPUT cassette generated:', len(data), 'bytes')
          PY
          ls -lh ports/zx81/pio16_release/PIOCO_AI_English_16K_ROM_INPUT.t81 build/zx81/*.bin
      - name: Upload PIOCO ZX81 16K ROM INPUT cassette
        uses: actions/upload-artifact@v4
        with:
          name: PIOCO_AI_English_16K_ROM_INPUT
          path: |
            GLM/reference/glm-v0.5.4/ports/zx81/pio16_release/PIOCO_AI_English_16K_ROM_INPUT.t81
            GLM/reference/glm-v0.5.4/build/zx81/*.P
            GLM/reference/glm-v0.5.4/build/zx81/*.bin
          if-no-files-found: error
