name: PIOCO ZX81 16K Z88DK build

on:
  push:
    branches:
      - work/pio-co-16k-z88dk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zx81-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
      - name: Apply English QAT and 18-row RAMTOP source fixes
        working-directory: GLM/reference/glm-v0.5.4
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # App: use the model's actual RTLM size and append the English intent tag.
          p = Path("ports/zx81/app16.c")
          s = p.read_text()
          s = s.replace('#define MSIZE 1030              /* the class-G blob: fixed layout */', '')
          s = s.replace('#include "rt_engine.h"\n', '#include "rt_engine.h"\n#include "intent16.h"\n')
          s = s.replace('static rt_u16 model_addr;      /* where the magic scan found the blob */\n#define TAG_AT     (model_addr + MSIZE)\n#define NAMTAB_AT  (model_addr + MSIZE + 12)',
                        'static rt_u16 model_addr;      /* where the magic scan found the blob */\nstatic rt_u16 model_size;      /* parsed from the RTLM header */\n#define TAG_AT     (model_addr + model_size)\n#define NAMTAB_AT  (model_addr + model_size + 12)')
          s = s.replace('model_addr = a;\n                namtab = a + MSIZE + 12;',
                        'model_addr = a;\n                model_size = (rt_u16)rt_model_size(&model.hdr);\n                namtab = a + model_size + 12;')
          s = s.replace('rt_chat_push(&chat, line);\n        gen_reply();',
                        'rt_chat_push(&chat, line);\n        rt_chat_push(&chat, rt16_reply_tag(line));\n        rt_chat_push_idx(&chat, 0);\n        gen_reply();')
          if 'rt16_reply_tag(line)' not in s or 'model_size = (rt_u16)rt_model_size' not in s:
              raise SystemExit("app16 English model/tag patch did not apply cleanly")
          p.write_text(s)
          # HAL: with 18 display rows, rows 8..15 are the chat console.
          p = Path("ports/zx81/hal_zx81.c")
          s = p.read_text()
          old = '#define ZX81_TEXT_BOT 21  /* rows 22-23 = the ROM\'s lower screen (DF_SZ=2):\n                              never written by us, the ROM owns them */'
          new = '#ifdef ZX81_RAMTOP_LAYOUT\n#define ZX81_TEXT_BOT 15\n#else\n#define ZX81_TEXT_BOT 21  /* rows 22-23 belong to the ROM */\n#endif'
          if old not in s:
              raise SystemExit("HAL text-bottom definition not found")
          p.write_text(s.replace(old, new))
          # Tape builder: 18-row D_FILE, dynamic model blob size, and $7F80 stack top.
          p = Path("tools/t81build16.py")
          s = p.read_text()
          old = 'VARS = DFILE + 793\nELINE = VARS + 1\nMSIZE = 1030'
          new = '''LAYOUT = os.environ.get("RT16_LAYOUT", "legacy").lower()
          if LAYOUT == "legacy":
              DFILE_LINES, RAMTOP_ADDR = 24, 0x7FFD
          elif LAYOUT == "ramtop":
              DFILE_LINES, RAMTOP_ADDR = 18, 0x7F80
          else:
              raise ValueError("RT16_LAYOUT must be legacy or ramtop")
          DFILE_SIZE = 1 + DFILE_LINES * 33
          VARS = DFILE + DFILE_SIZE
          ELINE = VARS + 1'''
          if old not in s: raise SystemExit("builder constants not found")
          s = s.replace(old, new)
          s = s.replace('s[29:31] = le16(0x7FFD)', 's[29:31] = le16(RAMTOP_ADDR)')
          s = s.replace('return b"\\x76" + (b"\\x00" * 32 + b"\\x76") * 24',
                        'return b"\\x76" + (b"\\x00" * 32 + b"\\x76") * DFILE_LINES')
          marker = '\ndef build_image(code, model, tag_idx, tag_name, load_name, with_save):'
          helper = '''
          def model_blob_size(model):
              """Read the RTLM v2 dimensions and validate the exact blob length."""
              import struct
              if len(model) < 94 or model[:4] != b"RTLM":
                  raise ValueError("invalid RTLM model header")
              vocab, ctx, emb, h1, h2 = struct.unpack_from("<5H", model, 8)
              n = 92 + vocab * emb + h1 + h1 * (ctx * emb + 1)
              if h2:
                  n += h2 + h2 * (h1 + 1)
              n += vocab + vocab * ((h2 if h2 else h1) + 1) + 2
              if n != len(model):
                  raise ValueError(f"RTLM size mismatch: header says {n}, file has {len(model)}")
              return n
          '''
          if marker not in s: raise SystemExit("builder insertion point not found")
          s = s.replace(marker, "\n" + helper + marker)
          s = s.replace('    assert M <= DFILE - 17 - 116 - 12 - MSIZE, \\',
                        '    msize = model_blob_size(model)\n    assert M <= DFILE - 17 - 116 - 12 - msize, \\')
          s = s.replace('tag = M + MSIZE', 'tag = M + msize')
          import re
          s, count = re.subn(r"assert len.*MSIZE,.*", 'assert len(model) == model_blob_size(model), "invalid RTLM blob size"', s)
          if count != 1: raise SystemExit(f"expected one fixed model-size assertion, found {count}")
          s = s.replace('assert Z + len(img) < DFILE - 793, "boot chain too big"',
                        'assert Z + len(img) < DFILE - DFILE_SIZE, "boot chain too big"')
          p.write_text(s)
          PY
      - name: Build actual English QAT model and ZX81 programs
        working-directory: GLM/reference/glm-v0.5.4
        run: |
          set -euxo pipefail
          mkdir -p build/zx81/models_en models16_v05_en ports/zx81/pio16_release
          cat > build/zx81/english8_qat_g2.bin.b64 <<'MODEL'
          
          MODEL
          base64 -d build/zx81/english8_qat_g2.bin.b64 > models16_v05_en/english8_qat_g2.bin
          DEFS="-DZX81_RAMTOP_LAYOUT -DRT_MAX_VOCAB=48 -DRT_MAX_CTX=8 -DRT_MAX_EMB=4 -DRT_MAX_HID=8 -DRT_APP_MODEL_MAX=1100 -DRT_MEM_MAX=6 -DRT_JOURNAL_MAX=8 -DRT_LINE_MAX=64"
          docker pull z88dk/z88dk:latest
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src/GLM/reference/glm-v0.5.4 z88dk/z88dk:latest zcc +zx81 -vn -O3 -compiler=80cc -m -zorg=16514 -create-app $DEFS -Iengine -Iports/zx81 -o build/zx81/rtchat16 ports/zx81/hal_zx81.c ports/zx81/app16.c ports/zx81/intent16.c engine/rt_charset.c engine/rt_model.c engine/rt_engine.c engine/rt_chat.c
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src/GLM/reference/glm-v0.5.4 z88dk/z88dk:latest zcc +zx81 -vn -O3 -m -zorg=16514 -create-app $DEFS -Iengine -Iports/zx81 -o build/zx81/rboot16 ports/zx81/hal_zx81.c ports/zx81/boot16.c
          python3 tools/extract_zx81_rem.py build/zx81/rtchat16.P build/zx81/rtchat16.bin
          python3 tools/extract_zx81_rem.py build/zx81/rboot16.P build/zx81/rboot16.bin
          for name in base_g topic_science topic_lifestyle topic_hobby topic_health topic_work topic_art topic_learning topic_literature topic_movies topic_programming topic_astronomy topic_asciiart topic_verse; do cp models16_v05_en/english8_qat_g2.bin "build/zx81/models_en/$name.bin"; done
          RT16_LAYOUT=ramtop python3 tools/t81build16.py build/zx81/rtchat16.bin build/zx81/rboot16.bin build/zx81/models_en ports/zx81/pio16_release
          cp ports/zx81/pio16_release/GLM_v054_RT16_TOPICS.t81 ports/zx81/pio16_release/PIOCO_AI_English_16K.t81
          RT16_LAYOUT=ramtop python3 tools/verify_ramtop_tape.py ports/zx81/pio16_release/PIOCO_AI_English_16K.t81
          ls -lh ports/zx81/pio16_release/PIOCO_AI_English_16K.t81 build/zx81/*.bin
      - name: Upload PIOCO ZX81 16K cassette
        uses: actions/upload-artifact@v4
        with:
          name: PIOCO_AI_English_16K
          path: |
            GLM/reference/glm-v0.5.4/ports/zx81/pio16_release/PIOCO_AI_English_16K.t81
            GLM/reference/glm-v0.5.4/build/zx81/*.P
            GLM/reference/glm-v0.5.4/build/zx81/*.bin
          if-no-files-found: error
